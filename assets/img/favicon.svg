<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#1a1a2e"/>

  <!-- Robot head body -->
  <rect x="18" y="28" width="64" height="52" rx="8" fill="#2d6a9f"/>
  <rect x="18" y="28" width="64" height="52" rx="8" fill="none" stroke="#4fc3f7" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="50" y1="28" x2="50" y2="14" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="11" r="5" fill="#ff6b6b"/>
  <circle cx="50" cy="11" r="2" fill="#fff"/>

  <!-- Eyes -->
  <rect x="26" y="38" width="18" height="13" rx="3" fill="#0d0d0d"/>
  <rect x="56" y="38" width="18" height="13" rx="3" fill="#0d0d0d"/>
  <!-- Eye glow -->
  <rect x="28" y="40" width="14" height="9" rx="2" fill="#00e5ff" opacity="0.9"/>
  <rect x="58" y="40" width="14" height="9" rx="2" fill="#00e5ff" opacity="0.9"/>
  <!-- Pupils -->
  <rect x="33" y="42" width="5" height="5" rx="1" fill="#fff" opacity="0.8"/>
  <rect x="63" y="42" width="5" height="5" rx="1" fill="#fff" opacity="0.8"/>

  <!-- Nose dot -->
  <circle cx="50" cy="58" r="2.5" fill="#4fc3f7"/>

  <!-- Mouth / speaker grille -->
  <rect x="28" y="63" width="44" height="10" rx="4" fill="#0d0d0d"/>
  <line x1="34" y1="63" x2="34" y2="73" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="42" y1="63" x2="42" y2="73" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="50" y1="63" x2="50" y2="73" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="58" y1="63" x2="58" y2="73" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="66" y1="63" x2="66" y2="73" stroke="#4fc3f7" stroke-width="1.5"/>

  <!-- Ear bolts -->
  <circle cx="18" cy="45" r="4" fill="#4fc3f7"/>
  <circle cx="18" cy="55" r="4" fill="#4fc3f7"/>
  <circle cx="82" cy="45" r="4" fill="#4fc3f7"/>
  <circle cx="82" cy="55" r="4" fill="#4fc3f7"/>
</svg>
